# Used when this app runs on the same host as FreeRADIUS/daloRADIUS (e.g. the "wisp-server-test"
# LXC clone) — see docs/ARCHITECTURE.md's "co-locate on-prem" option and docs/RADIUS-INTEGRATION.md.
# `web` uses host networking so it can reach MariaDB on the LXC's own 127.0.0.1:3306 without any
# bind-address change there, and so the splash page is directly reachable on the hotspot VLAN
# interface (eth0) exactly like it would be in production.
#
# Run with: docker compose -f docker-compose.lxc.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_password
      POSTGRES_DB: wisp_portal
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d wisp_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production build (`target: runner`), not `dev` — this service is reachable from the public
  # internet via the `tunnel` service below. Next.js dev mode prints full stack traces with source
  # code on any unhandled error, which we've already seen leak once; a production build doesn't.
  # No bind-mount here either — the image is self-contained, so code changes need a rebuild
  # (`docker compose up -d --build web`), not just a file sync.
  web:
    build:
      context: .
      target: runner
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgres://portal:portal_dev_password@localhost:5435/wisp_portal

  # Gives `web` a stable public HTTPS URL (a named Cloudflare Tunnel, routed to this deployment's
  # own domain) so Safaricom's STK Push callback can actually reach it — Safaricom rejects
  # http/localhost callback URLs outright, see docs/MPESA-INTEGRATION.md. The tunnel's own
  # credentials/config live in ./.cloudflared on the server (deployment-specific, gitignored like
  # .env — never synced from a local checkout; set up once via `cloudflared tunnel login/create/
  # route dns`, documented in docs/INSTALL.md).
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./.cloudflared:/home/nonroot/.cloudflared:ro

volumes:
  db-data:
