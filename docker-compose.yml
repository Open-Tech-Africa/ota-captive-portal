services:
  # This app's own database. The FreeRADIUS/daloRADIUS MariaDB is a separate, real box — see
  # docs/RADIUS-INTEGRATION.md — and is never stood up by this compose file.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_dev_password
      POSTGRES_DB: wisp_portal
    ports:
      # 5435 on the host: 5432/5434 are commonly taken by other local Postgres instances
      - "127.0.0.1:5435:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d wisp_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - WATCHPACK_POLLING=true
      # inside the compose network the database host is `db`, not localhost
      - DATABASE_URL=postgres://portal:portal_dev_password@db:5432/wisp_portal
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  web-prod:
    profiles: ["prod"]
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgres://portal:portal_dev_password@db:5432/wisp_portal

  # Ephemeral public HTTPS URL, no Cloudflare account or domain needed — for trying the app end to
  # end (M-Pesa/Paystack callbacks need a real public URL, see docs/MPESA-INTEGRATION.md). Prints a
  # random https://<something>.trycloudflare.com URL to its logs; a new one every restart, with no
  # access control in front of it — fine for testing, not for a real deployment. See README's
  # Quickstart. Start with: docker compose --profile tunnel up -d
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:3000

  # Production-grade alternative to the ephemeral tunnel above: a named Cloudflare Tunnel on a
  # domain you control, so the URL is stable across restarts. See README's "Using your own domain"
  # section for one-time setup (login/create/route-dns) before this will do anything — its
  # credentials live in ./.cloudflared (gitignored, set up per instance, never committed). Start
  # with: docker compose --profile named-tunnel up -d
  named-tunnel:
    profiles: ["named-tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    volumes:
      - ./.cloudflared:/home/nonroot/.cloudflared:ro

volumes:
  db-data:
